<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>我要下班！</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      background: #0e0f12;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    /* 竖屏舞台：桌面 9:16 居中，真机铺满。HUD 全部相对舞台，不要用视窗自适应。 */
    #stage {
      position: relative;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      overflow: hidden;
      background: #1a1a1e;
      flex-shrink: 0;
    }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }

    #topbar {
      position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; z-index: 10;
      padding-top: 10px;
    }
    #deadline {
      background: rgba(20, 22, 30, 0.72); color: #fff;
      padding: 8px 18px; border-radius: 20px;
      font-size: 16px; font-weight: 600; letter-spacing: 1px;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    #deadline.hit { background: rgba(220, 60, 50, 0.85); }

    #badgeInfo {
      background: rgba(20, 22, 30, 0.55); color: #d9c069;
      padding: 3px 12px; border-radius: 12px;
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
    }

    /* 不暂停抽卡：记分牌正下方三选一，8 秒倒计时走完自动随机 */
    #cardRow { pointer-events: auto; width: 100%; padding: 0 8px; }
    #cardList { display: flex; gap: 6px; justify-content: center; }
    .card {
      position: relative; flex: 1; max-width: 112px; min-width: 0;
      padding: 8px 5px 8px; border-radius: 14px; border: 2px solid #888;
      background: rgba(18, 20, 28, 0.9); color: #eee;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      backdrop-filter: blur(6px);
      animation: cardIn 0.22s ease-out backwards;
    }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    @keyframes cardIn {
      from { transform: translateY(-14px) scale(0.88); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .card.cardDash { border-radius: 8px 16px 8px 16px; }
    .card.picked { transform: scale(1.06); filter: brightness(1.15); }
    .cglyph { font-size: 20px; line-height: 1.15; }
    .cname { font-size: 12px; font-weight: 800; }
    .ctag { font-size: 9px; color: #ffd873; font-weight: 700; }
    .cdesc { font-size: 9px; color: #aab; line-height: 1.25; text-align: center; }
    .ckey {
      position: absolute; top: 3px; left: 5px;
      font-size: 9px; color: rgba(255,255,255,0.4); font-weight: 700;
    }
    #cardTimerWrap {
      margin: 5px auto 0; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #cardSecs {
      min-width: 22px; text-align: right;
      font-size: 12px; font-weight: 800; color: #ffd257;
      font-variant-numeric: tabular-nums;
    }
    #cardTimerTrack {
      width: 148px; height: 4px;
      background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden;
    }
    #cardTimerBar { height: 100%; width: 100%; background: #ffd257; border-radius: 2px; }

    .flyChip {
      position: fixed; z-index: 60; width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 22px; pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.5, 0, 0.6, 1), opacity 0.45s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    #stats {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 10px;
      color: rgba(255,255,255,0.75); font-size: 11px; line-height: 1.5;
      pointer-events: none; z-index: 10; font-family: Menlo, monospace;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .stick {
      position: absolute; z-index: 20; pointer-events: none; display: none;
    }
    .stick .base {
      position: absolute; width: 110px; height: 110px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08);
      transform: translate(-50%, -50%);
    }
    .stick .knob {
      position: absolute; width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      transform: translate(-50%, -50%);
    }
    #stickAim .base { border-color: rgba(255, 160, 90, 0.55); }
    #stickAim .knob { background: rgba(255, 160, 90, 0.75); }

    #dashBtn {
      position: absolute; right: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(80, 160, 255, 0.25);
      border: 2px solid rgba(120, 190, 255, 0.7);
      color: #cfe8ff; font-size: 13px; font-weight: 700;
      z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.15s;
    }
    #dashBtn.cd { opacity: 0.35; }

    #skillBtn {
      position: absolute; right: 30px; bottom: calc(env(safe-area-inset-bottom, 0px) + 192px);
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #dde; font-size: 12px; font-weight: 700;
      z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.15s; line-height: 1.2;
    }
    #skillBtn.empty { border-style: dashed; opacity: 0.55; }
    #skillBtn.cd { opacity: 0.4; }
    #skillBtn .hint { font-size: 9px; color: #99a; }
    .blab { font-size: 12px; font-weight: 700; line-height: 1.25; }
    .pips { display: flex; gap: 3px; justify-content: center; margin-top: 2px; }
    .pip { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); }
    .pip.on { background: #fff; }
    .cdnum {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    #resetBtn {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 10px;
      z-index: 30; background: rgba(255,255,255,0.12); color: #fff;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
      padding: 5px 12px; font-size: 12px;
    }

    .play-ui { display: none; }
    #stage[data-mode="play"] .play-ui,
    #stage[data-mode="result"] .play-ui { display: block; }
    #stage[data-mode="play"] #dashBtn,
    #stage[data-mode="play"] #skillBtn,
    #stage[data-mode="result"] #dashBtn,
    #stage[data-mode="result"] #skillBtn { display: flex; }
    #stage[data-mode="play"] #topbar,
    #stage[data-mode="result"] #topbar { display: flex; }

    #stats { display: none; }
    #stage[data-mode="play"] #stats.debugOn,
    #stage[data-mode="result"] #stats.debugOn { display: block; }

    #overlay {
      position: absolute; inset: 0; z-index: 90;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(15, 17, 22, 0.82); color: #fff; gap: 14px;
      backdrop-filter: blur(4px); text-align: center;
    }
    #stage[data-mode="result"] #overlay { display: flex; }
    #overlay .otitle { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
    #overlay .osub { font-size: 15px; color: #bbb; line-height: 1.7; padding: 0 30px; }
    #overlay button, .shellBtn {
      margin-top: 4px; padding: 12px 42px; border-radius: 26px; border: none;
      background: #3b82f6; color: #fff; font-size: 17px; font-weight: 700;
    }
    #overlay .ghost, .shellBtn.ghost {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.28);
    }

    #loading, #levels, #settings {
      position: absolute; inset: 0; z-index: 80;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(16, 14, 22, 0.86); color: #eee; gap: 14px; padding: 24px 22px;
    }
    #home {
      position: absolute; inset: 0; z-index: 80;
      display: none; flex-direction: column; align-items: center; justify-content: flex-end;
      background: linear-gradient(180deg, rgba(10, 9, 14, 0.28) 0%, rgba(10, 9, 14, 0.12) 38%, rgba(10, 9, 14, 0.82) 100%);
      color: #eee; gap: 14px; padding: 28px 22px calc(env(safe-area-inset-bottom, 0px) + 36px);
    }
    #stage[data-mode="loading"] #loading { display: flex; }
    #stage[data-mode="home"] #home { display: flex; }
    #stage[data-mode="levels"] #levels { display: flex; }
    #stage[data-mode="settings"] #settings { display: flex; }
    #loading { background: #121018; justify-content: center; }

    .artSlot {
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.22);
      border-radius: 16px;
    }
    .artSlot img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .artSlot.empty img { display: none; }
    .artSlot.empty::after {
      content: attr(data-label);
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
    }
    #loadingBg {
      position: absolute; inset: 0; border: none; border-radius: 0; z-index: 0;
    }
    #loadingHero {
      position: relative; z-index: 1; width: min(220px, 58%); aspect-ratio: 1;
      margin-bottom: 8px;
    }
    #loadingLogo {
      position: relative; z-index: 1; width: min(260px, 72%); height: 72px;
    }
    #loadingBar {
      position: relative; z-index: 1; width: min(220px, 64%); height: 4px;
      background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden;
    }
    #loadingBar > i {
      display: block; height: 100%; width: 40%; background: #3b82f6;
      animation: loadSlide 1.1s ease-in-out infinite;
    }
    @keyframes loadSlide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    #homeLogo {
      width: min(280px, 78%); height: 96px; margin-bottom: auto; margin-top: 12vh;
    }

    .shellTitle { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
    .shellSub, #loading .sub { font-size: 13px; color: #c5c0b8; text-shadow: 0 1px 4px rgba(0,0,0,0.55); }
    #loading:has(#loadingLogo:not(.empty)) .title { display: none; }
    #home:has(#homeLogo:not(.empty)) .shellSub { margin-top: -8px; }
    .shellStack { display: flex; flex-direction: column; gap: 12px; width: min(280px, 80%); }
    .shellBtn { width: 100%; }
    .shellBack { align-self: flex-start; background: transparent; border: none; color: #bbb; font-size: 15px; padding: 8px 0; }
    #levelList { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 70%; }
    .levelCard {
      text-align: left; width: 100%; padding: 12px 14px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06);
      color: #eee; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    }
    .levelCard.locked { opacity: 0.42; }
    .levelDay { font-size: 18px; font-weight: 800; }
    .levelTag { font-size: 11px; color: #ffd873; align-self: center; }
    .levelBlurb { grid-column: 1 / -1; font-size: 12px; color: #9aa; }
    .optRow { display: flex; justify-content: space-between; align-items: center; width: min(300px, 86%); font-size: 15px; }
    .optRow input { width: 18px; height: 18px; }

    #toast {
      position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
      color: #ffb4a8; font-size: 20px; font-weight: 800; z-index: 15;
      pointer-events: none; opacity: 0; text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: opacity 0.15s; white-space: nowrap;
    }
    #elevTimer {
      background: rgba(40, 160, 90, 0.85); color: #fff;
      padding: 6px 16px; border-radius: 16px;
      font-size: 15px; font-weight: 700;
      display: none; pointer-events: none; white-space: nowrap;
    }
    #topbar, #resetBtn, #dashBtn, #skillBtn { display: none; }
    #stage[data-mode="play"] #topbar,
    #stage[data-mode="result"] #topbar { display: flex; }
    #stage[data-mode="play"] #resetBtn,
    #stage[data-mode="result"] #resetBtn { display: block; }
    #stage[data-mode="play"] #dashBtn,
    #stage[data-mode="play"] #skillBtn,
    #stage[data-mode="result"] #dashBtn,
    #stage[data-mode="result"] #skillBtn { display: flex; }
  </style>
</head>
<body>
  <div id="stage" data-mode="loading">
  <div id="app"></div>

  <div id="topbar">
    <div id="deadline">预计下班 18:00</div>
    <div id="cardRow" style="display:none">
      <div id="cardList"></div>
      <div id="cardTimerWrap">
        <div id="cardSecs">8s</div>
        <div id="cardTimerTrack"><div id="cardTimerBar"></div></div>
      </div>
    </div>
    <div id="badgeInfo"></div>
    <div id="elevTimer"></div>
  </div>
  <div id="stats"></div>
  <div id="toast"></div>

  <div id="overlay">
    <div class="otitle"></div>
    <div class="osub"></div>
    <button id="resultNext" type="button">下一关</button>
    <button id="resultRetry" type="button" class="ghost">再试一次</button>
    <button id="resultHome" type="button" class="ghost">回主页</button>
  </div>

  <div id="stickMove" class="stick"><div class="base"></div><div class="knob"></div></div>
  <div id="stickAim" class="stick"><div class="base"></div><div class="knob"></div></div>
  <button id="dashBtn">冲刺</button>
  <button id="skillBtn" class="empty">技能<br><span class="hint">抽卡获得</span></button>
  <button id="resetBtn">返回</button>

  <div id="loading">
    <div id="loadingBg" class="artSlot empty" data-label="Loading 背景"><img alt="" src="%BASE_URL%ui/loading-bg.png" /></div>
    <div id="loadingHero" class="artSlot empty" data-label="角色图"><img alt="" src="%BASE_URL%ui/loading-hero.png" /></div>
    <div id="loadingLogo" class="artSlot empty" data-label="Logo"><img alt="" src="%BASE_URL%ui/logo.png" /></div>
    <div class="title">我要下班！</div>
    <div class="sub">加载中…</div>
    <div id="loadingBar"><i></i></div>
  </div>

  <div id="home">
    <div id="homeLogo" class="artSlot empty" data-label="标题 Logo"><img alt="我要下班！" src="%BASE_URL%ui/home-title.png" /></div>
    <div class="shellSub">把同事引开，挤进电梯</div>
    <div class="shellStack">
      <button type="button" class="shellBtn" id="btnStart">开始游戏</button>
      <button type="button" class="shellBtn ghost" id="btnLevels">关卡</button>
      <button type="button" class="shellBtn ghost" id="btnSettings">设置</button>
    </div>
  </div>

  <div id="levels">
    <button type="button" class="shellBack" id="btnLevelsBack">← 主页</button>
    <div class="shellTitle">本周班次</div>
    <div class="shellSub">通关后解锁下一天</div>
    <div id="levelList"></div>
  </div>

  <div id="settings">
    <button type="button" class="shellBack" id="btnSettingsBack">← 主页</button>
    <div class="shellTitle">设置</div>
    <label class="optRow"><span>音效（即将加入）</span><input id="optSfx" type="checkbox" checked /></label>
    <label class="optRow"><span>显示调试信息</span><input id="optDebug" type="checkbox" /></label>
    <button type="button" class="shellBtn ghost" id="optReset">重置闯关进度</button>
  </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
